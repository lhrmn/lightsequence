
[project]
name = "lumiblox"
version = "0.1.0"
description = "Professional party lighting controller for Novation Launchpad MK2"
readme = "README.md"
authors = [{name = "Party Lights"}]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pyside6>=6.9.3",
    "numpy>=2.0.2",
    "typing-extensions>=4.15.0",
    "isort>=6.1.0",
    "mss>=10.1.0",
    "qtawesome>=1.4.0",
    "opencv-python>=4.11.0.86",
    "pillow>=11.3.0",
    "scikit-learn>=1.6.1",
    "joblib>=1.5.2",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["lumiblox*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
lumiblox-cli = "lumiblox.controller.main:main"
lumiblox = "lumiblox.gui.gui:main"

